services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://billing:billing@db:5432/billing
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-admin-token}
      # Lets webhooks reach http:// and private addresses (a local WooCommerce, a tunnel).
      # Set to "false" in production.
      WEBHOOK_ALLOW_PRIVATE: ${WEBHOOK_ALLOW_PRIVATE:-true}
    ports:
      - "3000:3000"

volumes:
  pgdata:
